name: Astro build check

# Builds the 2nd® Gen Astro preview on PRs. Does not deploy.
on:
  pull_request:
    paths:
      - "astro/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: npm ci
      - run: npm run build
